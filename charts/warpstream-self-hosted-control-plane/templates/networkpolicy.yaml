{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wscp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wscp.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "wscp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Agents, health checks and metrics.
    - ports:
        - port: {{ .Values.ports.http }}
          protocol: TCP
      {{- with .Values.networkPolicy.agentIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Traffic between control plane replicas.
    - ports:
        - port: {{ .Values.ports.http }}
          protocol: TCP
        - port: {{ .Values.ports.clusterRegistry }}
          protocol: TCP
        - port: {{ .Values.ports.clusterEnvironment }}
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "wscp.selectorLabels" . | nindent 14 }}
{{- end }}
