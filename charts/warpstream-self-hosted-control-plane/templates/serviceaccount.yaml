{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
metadata:
  name: {{ include "wscp.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wscp.labels" . | nindent 4 }}
  {{- with (mergeOverwrite (dict) (default (dict) .Values.annotations) (default (dict) .Values.serviceAccount.annotations)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
